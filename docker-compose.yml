services:
  lab-safety-monitoring:
    build: .
    container_name: MyCam
    ports:
      - "5000:5000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-}
      DATABASE: /app/instance/calendar.sqlite
      CAMERA_INDEX: ${CAMERA_INDEX:-0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    volumes:
      - lab_safety_data:/app/instance
    restart: unless-stopped
volumes:
  lab_safety_data:
