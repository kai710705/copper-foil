{% extends 'base.html' %}
{% block body %}
<main class="auth glass"><h1>變更密碼</h1><p>首次登入請先變更預設密碼。</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>目前密碼<input type="password" name="current_password" required autocomplete="current-password"></label>
<label>新密碼<input type="password" name="password" minlength="8" maxlength="128" required autocomplete="new-password"></label>
<button>更新密碼</button></form></main>
{% endblock %}
