<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>人工標註｜銅箔瑕疵</title><link rel="stylesheet" href="/static/vendor/bootstrap.min.css"><link rel="stylesheet" href="/static/css/style.css"></head><body>
<nav><a class="brand" href="/">台南大學實驗室監控系統</a><div><a href="/inspections/pending">返回待處理</a><a href="/">返回首頁</a></div></nav>
<main id="annotateApp" class="container py-5"><section class="rounded-2xl bg-white/70 p-4 shadow-lg"><h1 class="h3">人工標註檢測 #{{ inspection_id }}</h1><p class="text-muted">拖曳框選瑕疵，再選擇瑕疵類型；完成後可匯出 YOLO 訓練資料。</p><div class="row g-4"><div class="col-lg-8"><div class="position-relative bg-dark"><img ref="image" :src="imageUrl" class="w-100 d-block" @load="redraw"><canvas ref="canvas" class="position-absolute top-0 start-0" @mousedown="begin" @mousemove="move" @mouseup="end"></canvas></div></div><div class="col-lg-4"><label class="form-label" for="defect">新增框的瑕疵類型</label><select id="defect" class="form-select" v-model="defect"><option v-for="name in classes" :value="name" v-text="name"></option></select><button class="btn btn-primary mt-3" @click="save" :disabled="saving">儲存人工標註</button><button class="btn btn-outline-danger mt-3 ms-2" @click="clear">清除全部框</button><h2 class="h6 mt-4">目前標註：<span v-text="boxes.length"></span> 個</h2><ul class="small"><li v-for="(box,index) in boxes" :key="index"><span v-text="box.defect_type"></span> <button class="btn btn-sm btn-link text-danger" @click="remove(index)">刪除</button></li></ul></div></div></section></main><script src="/static/vendor/vue.global.prod.js"></script><script src="/static/vendor/axios.min.js"></script><script src="/static/vendor/sweetalert2.all.min.js"></script><script src="/static/js/http.js?v=20261026-1"></script><script>window.INSPECTION_ID={{ inspection_id }};</script><script src="/static/js/inspection-annotate.js?v=20261026-1"></script></body></html>
